name: Run Scraper

on:
  schedule:
    - cron: "*/15 11-23 * * *"  # every 15 min, 6am–6pm ET (UTC 11–23)
    - cron: "*/15 0-2 * * *"    # every 15 min, 7pm–10pm ET (UTC 0–2)
    - cron: "0 12 * * *"        # notify — 7am ET
    - cron: "0 17 * * *"        # notify — 12pm ET
    - cron: "0 23 * * *"        # notify — 6pm ET
    - cron: "0 3 * * *"         # notify — 10pm ET
  workflow_dispatch:
    inputs:
      limit:
        description: "Articles per source (leave empty for full run)"
        required: false
        default: ""

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only run on the 4 notification cron triggers, not the 15-min scrape crons
    if: github.event.schedule == '0 12 * * *' || github.event.schedule == '0 17 * * *' || github.event.schedule == '0 23 * * *' || github.event.schedule == '0 3 * * *'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Send notifications
        working-directory: scraper
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          APNS_BUNDLE_ID: ${{ secrets.APNS_BUNDLE_ID }}
          APNS_KEY: ${{ secrets.APNS_KEY }}
        run: python notify.py

  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/sentence_transformers
          key: sentence-transformers-all-MiniLM-L6-v2

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        working-directory: scraper
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          if [ -n "$LIMIT" ]; then
            python compare.py --limit "$LIMIT"
          else
            python compare.py
          fi
